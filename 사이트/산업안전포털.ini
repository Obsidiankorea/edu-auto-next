; ==================================================
; 사이트 프로필 - 산업안전포털 (edu.kosha.or.kr)
;
; 화면 좌표가 아니라, 웹페이지 안의 '코드'(class / id / 이름)로 요소를 찾습니다.
;
; 적는 법
;   class:값   id:값   name:값      그 글자가 들어 있으면 맞는 것으로 봄
;   A && B                          둘 다 맞아야 함
;   A || B                          둘 중 되는 것을 씀  (스킨이 여러 가지일 때)
; [읽을것] 에서만 더 쓸 수 있는 것
;   무늬:정규식                     class 가 없는 글자를 모양으로 찾음
;   숫자쌍                          '01' '08' 처럼 나란한 숫자 두 개
;
; 이 사이트는 플레이어 스킨이 세 가지입니다.
;   스킨1: class=page / curTime / totTime / pageBox 를 씀
;   스킨2: id=nextBtn / playBtn 을 쓰고, 시간·페이지는 class 가 없는 글자임
;   스킨3: 강의실 페이지 안에 뜨는 영상 창 (video.js, class=eduVideo)
;          시간은 현재 시간만 있고 전체 시간이 없음 → 영상의 class 에 vjs-ended 가 붙으면 끝
;          한 차시가 여러 '동영상 페이지' 로 되어 있을 수 있고, 페이지가 끝나면
;          '다음 동영상 페이지를 학습하시겠습니까?' 안내창이 뜬다 → [안내창] 에서 확인을 누름
;          마지막 페이지가 끝나면 영상 창을 닫고 차시 표에서 다음 줄의 '학습하기' 를 누름
; 모두 되도록 || 로 이어 적어 두었습니다.
;
; 새 사이트를 만들려면 [코드 목록 뽑기] 로 코드를 확인한 뒤
; 이 파일을 복사해서 이름을 바꾸고 고치세요.
; ==================================================

[사이트]
이름 = 산업안전포털
창제목 = 산업안전포털
설명 = 한국산업안전보건공단 교육시스템 (edu.kosha.or.kr)

[누를것]
다음 = id:nextBtn || class:page && name:다음페이지
이전 = id:prevBtn || class:page && name:이전페이지
재생 = id:playBtn && name:재생 || class:button play || class:play && name:Play
일시정지 = id:playBtn && name:일시정지 || class:button pause
다시보기 = id:replayBtn || class:button replay
; 영상 창의 X 버튼. class 가 정확히 close 인 것 (따옴표). 따옴표가 없으면 closeMenu(메뉴 닫기)가 먼저 잡혀 영상 창을 못 닫았다
닫기 = class:"close" && name:닫기
; 영상 위에 뜨는 '버튼을 클릭하세요' 풍선 (스킨1 / 스킨2)
풍선 = id:nextBubble || class:nextAlert

[상태]
; 이 요소가 보이면 '재생 중' 으로 봅니다.
; 이 사이트 스킨2 의 재생 버튼은 이름이 늘 '재생' 이라 이름으로는 상태를 알 수 없습니다.
; 대신 class 에 pause 가 붙어 있으면 재생 중입니다.
;   재생 중 : controlSet controlBtn pause
;   멈춤    : controlSet controlBtn
재생중 = id:playBtn && class:controlBtn pause || class:button pause || class:vjs-playing
; 영상이 끝났다는 표시 (스킨3 은 전체 시간이 없어서 이것으로 끝을 안다)
끝남 = class:vjs-ended

[읽을것]
현재시간 = class:curTime || class:timer || 무늬:^\d{1,2}:\d{2}(:\d{2})?\s*/\s*\d{1,2}:\d{2}(:\d{2})?$ || 무늬:^\d{2}:\d{2}:\d{2}$
전체시간 = class:totTime
페이지 = class:pageBox || 숫자쌍
안내문구 = class:nextAlert || id:nextBubble
; 스킨3: 영상 창 글에서 차시 표의 어느 줄인지 찾는다 ('[인트로] 안전보건의 중요성')
차시 = 제목:class:eduVideo

[문제풀이]
class키워드 = quiz
이름키워드 = 정답을 고르세요 || 다음 중 || O/X
; 설정의 '퀴즈는 아무 답이나 누르고 넘어간다' 를 켰을 때
;   보기       : 아무거나 누를 답 (처음 찾은 것). 비워 두면 일반 규칙으로 아무 답이나 찾습니다.
;                이 사이트의 O/X 퀴즈는 O 버튼이 quizCheck_btn Li_1 이라 적어 두었습니다.
;   푼뒤누를것 : 답을 누르고 몇 초 뒤 누를 것 ([누를것] 의 이름). 비워 두거나 못 찾으면
;                '다음 / next / 확인 / 제출' 같은 이름의 버튼을 찾아 누릅니다.
보기 = class:quizCheck_btn
; 답을 누른 뒤 그 답의 class·이름에 이 글자가 붙으면 오답 → 아직 안 누른 다른 답을 누른다
;   (이 사이트는 오답이면 class 가 'quizCheck_btn Li_1 check wrong' 이 되고, 틀린 채 넘기면 그 페이지가 진도에 안 들어감)
오답표시 = \bwrong\b|incorrect|오답|틀렸
푼뒤누를것 = 다음 || 풍선

[동작]
; 영상이 끝나면 어떤 것을 누를지 ([누를것] 의 이름)
영상끝나면 = 다음
; 재생이 멈춰 있으면 무엇을 누를지
멈춰있으면 = 재생
; 재생 시간이 몇 초째 그대로여야 '진짜 멈춤' 으로 보고 재생을 누를지 (최소 3)
멈춤판단초 = 6
; 마지막 페이지까지 끝나면 무엇을 누를지 (비워두면 알림만)
강의끝나면 = 닫기

[차시]
; 한 차시가 끝나면 다음 차시로 넘어가는 기능 ([설정] → 차시) 에 쓰는 칸입니다.
; 이 사이트는 차시 목록이 학습창이 아니라 별도의 목록(내 강의실) 창에 있습니다.
; 창마다 코드가 다르니, 목록 창을 띄워 놓고 아래 순서로 한 번만 채워 넣으세요.
;
;   1. 차시 목록이 보이는 창을 띄웁니다.
;   2. 본체 창의 '차시 목록' 칸에서 그 창을 고릅니다. (자동으로 못 찾아도 이러면 됩니다)
;   3. [설정] → 차시 → [목록 읽기] 를 눌러 차시가 제대로 읽히는지 봅니다.
;   4. 잘 읽히면 아래 칸을 채워 두세요. 다음부터는 고르지 않아도 자동으로 찾습니다.
;   ※ 코드를 모르면 [설정] → 사이트 프로필 → [코드 목록 뽑기] (F10) 로 뽑아 보세요.
;
; 목록창   : 차시를 '누를' 창의 제목 일부 (학습창 이라고 적으면 강의 창 안에서 찾습니다)
; 진도창   : 전체 차시와 학습 시간을 '읽을' 창의 제목 일부 (없으면 비워 두세요)
; 차시링크 : 차시 줄을 찾는 규칙. || 로 여러 개 적으면 되는 것을 씁니다.
;              무늬:^(\d+)차시$        이름이 '3차시' 인 줄
;              id무늬:^lesson-(\d+)$   id 가 lesson-3 인 줄
; 학습시간 : 그 줄의 학습 시간 글자 (00:00:00 이면 아직 안 들은 것)
; 학습창닫기 : 목록 창이 따로일 때, 학습창을 닫는 버튼
; 스킨3: 차시 표가 영상과 같은 창에 있다. 줄마다 '학습하기' 버튼, 번호, 진도율(0%)
;   진도율 100% 인 차시는 건너뜀. 누르기 전에 영상 창을 닫는다 (넘기기전 = [누를것] 이름)
목록창 = 학습창
진도창 =
차시링크 = 버튼:class:takeLesson
학습시간 = 무늬:^\d{1,2}:\d{2}:\d{2}$
목록열기 =
학습창닫기 =
넘기기전 = 닫기

[안내창]
; 사이트가 띄우는 안내창 (스킨3: '1페이지 동영상 학습이 완료되었습니다. 다음 동영상 페이지를 학습하시겠습니까?')
; 누를글 이 있으면 누를것 을 누르고, 안누를글 이 있으면 절대 누르지 않는다. 둘 다 아니면 누르지 않고 알린다.
창 = class:normal && name:안내
누를글 = 다음 동영상 페이지|이어서 학습|이어보기|학습이 완료되었습니다|학습을 시작
안누를글 = 종료하시겠습니까|나가시겠습니까|취소하시겠습니까|삭제|재수강|응시
누를것 = class:submit && name:확인 || name:확인
