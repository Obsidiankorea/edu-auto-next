; ==================================================
; 사이트 프로필 - 한국보건복지인재원 보건복지배움인 (edu.kohi.or.kr)
;
; 적는 법은 산업안전포털.ini 머리말을 보세요.
;
; 창이 두 개입니다
;   학습창    : 제목이 '... < 학습창 | 한국보건복지인재원' 인 팝업. 여기서 영상이 돕니다.
;   나의학습실 : 제목이 '메인 > 나의학습실 > 학습하기' 인 창. 차시 표가 여기 있습니다.
;
; 플레이어는 plyr 입니다 (class 가 plyr__ 로 시작)
;  ┌──────────┬──────────────────────────────────────────────────────────┐
;  │ 다음 페이지│ id=paging_next  (화면 오른쪽 아래 ▷), 큰 화살표는 id=btn_vod_next │
;  │ 페이지    │ '1' 과 '/ 14' 이 따로 있어 숫자쌍 으로 읽습니다             │
;  │ 시간      │ class=plyr__time--current / --duration 안의 글자 (00:11)   │
;  │ 재생/멈춤 │ class=plyr__control (이름이 Play ↔ Pause 로 바뀜)          │
;  │           │ 도는 중에는 감싼 칸 class 에 plyr--playing 이 붙습니다      │
;  │ 학습종료  │ id=popup_close                                            │
;  └──────────┴──────────────────────────────────────────────────────────┘
;
; 차시 표 (나의학습실)
;   칸이 위아래로 쌓여 있습니다. 한 차시가
;     '차시 3차시' / '차시 명 ...' / '최초 학습일 ...' / '학습시간 0초' / '진도율(%) 0%' / '학습상태 학습하기'
;   그리고 그 아래에 누를 링크 '학습하기' (class=table__btn--modal) 가 있습니다.
;   그래서 차시링크 = 버튼:... 로 적고, 프로그램이 버튼 위쪽의 '3차시' 칸을 그 차시로 봅니다.
;   진도율(%) 이 100 인 차시는 건너뜁니다.
;
; 실제로 해 본 결과 (2026-09-25, 인권의 이해 6차시)
;   - 학습창 읽기: 시간 00:11/00:11, 페이지 1/14, 재생/멈춤 모두 제대로 읽힘
;   - 재생 버튼 누르기: 됨 (기본동작). 누르면 이름이 Play → Pause 로 바뀜
;   - 차시 표 읽기: 6차시, 이름·진도율 모두 읽힘 (전부 0% = 미학습)
;   - 차시 이동: 학습창 닫기 → 표 갱신(1차시 7%) → '학습하기' 눌러 새 학습창 열림
;     안내창(모달)은 뜨지 않았고, 새 창은 이어보기 위치(2/14 페이지)에서 멈춘 채로 열렸습니다.
; ==================================================

[사이트]
이름 = 한국보건복지인재원
; 학습창 제목: '인권의 이해 > INTRO < 학습창 | 한국보건복지인재원'
;   '학습창' 만 적으면 지방자치인재개발원 프로필과 겹치므로 사이트 이름으로 적습니다.
;   (겹칠 때는 더 자세한 창제목을 적어 둔 프로필이 뽑힙니다)
창제목 = 한국보건복지인재원
설명 = 한국보건복지인재원 보건복지배움인 (edu.kohi.or.kr) - plyr 플레이어
; 본체 창의 🌐 를 누르면 여기로 갑니다 (나의학습실). 다른 페이지로 바꿔도 됩니다.
주소 = https://edu.kohi.or.kr/pt/pi/pia/BD_pia0020l.do

[누를것]
; 페이지 넘기기 (화면 아래 ▷). 큰 화살표(id=btn_vod_next)도 같은 일을 합니다.
다음 = id:paging_next || id:btn_vod_next
이전 = id:paging_prev || id:btn_vod_prev
; plyr 재생 버튼. 멈춰 있을 때는 이름이 Play 입니다.
재생 = class:plyr__controls__item plyr__control && name:Play || class:plyr__control--overlaid
목차 = class:btn01
; 학습창 닫기 (오른쪽 위 '학습종료')
닫기 = id:popup_close

[상태]
; 도는 중이면 감싼 칸 class 에 plyr--playing 이 붙고, 재생 버튼 이름이 Pause 로 바뀝니다.
재생중 = class:plyr--playing || class:plyr__control && name:Pause

[읽을것]
; 안쪽: 은 '그 요소의 이름 대신 안에 있는 글자를 읽어라' 입니다.
; (이름은 Current time / Duration 이고, 정작 시간 00:11 은 그 안의 글자입니다)
현재시간 = 안쪽:class:plyr__time--current
전체시간 = 안쪽:class:plyr__time--duration
; 화면 아래 '1'  '/ 14'
페이지 = 숫자쌍
안내문구 =
; 학습창에는 차시 번호가 안 나옵니다. 대신 창 제목에 차시 이름이 있습니다.
;   '인권의 이해 > OUTRO < 학습창 | 한국보건복지인재원'
; 제목:창제목 → 창 제목에 들어 있는 차시 이름을 차시 표(나의학습실)에서 찾아 번호로 바꿉니다.
;   ('인권의 이해' → 1차시)  차시 표는 [시작] 할 때 한 번 읽어 둡니다.
; 번호를 알아야 다음 차시(2차시)로 갑니다. 모르면 진도율이 100 이 아닌 첫 차시로 가므로,
; 방금 들은 차시의 진도율이 늦게 오르면 같은 차시를 또 열 수 있습니다.
차시 = 제목:창제목

[문제풀이]
class키워드 = quiz
이름키워드 = 정답을 고르세요 || O/X || 다음 중 || 문제
시작 =
보기 =
푼뒤누를것 = 다음

[동작]
영상끝나면 = 다음
; 이 사이트는 페이지를 넘겨도 저절로 재생되지 않습니다. 사람이 누르듯 재생을 눌러 줘야 합니다.
멈춰있으면 = 재생
; 그래서 멈춤 판단을 짧게 둡니다 (최소 3초)
멈춤판단초 = 3
; 마지막 페이지까지 끝나면 학습창을 닫습니다.
;   닫아야 진도율이 갱신되는 경우가 있어서, 차시를 넘길 때도 먼저 닫습니다.
강의끝나면 = 닫기

[차시]
; 차시 표는 학습창이 아니라 '나의학습실' 창에 있습니다.
목록창 = 나의학습실
진도창 =
; 차시마다 있는 '학습하기' 링크. 프로그램이 버튼 위쪽의 'N차시' 칸을 그 차시로 봅니다.
차시링크 = 버튼:class:table__btn--modal
; 표의 학습시간은 '0초' 처럼 적혀 있어 시간 무늬로는 못 읽습니다. 대신 진도율(%) 을 씁니다.
학습시간 =
목록열기 =
; 차시 표가 다른 창(나의학습실)에 있으므로, 프로그램이 차시를 누르기 전에 이 버튼으로 학습창을 닫습니다.
; 닫은 뒤에 표를 다시 읽으므로 진도율도 갱신된 값으로 읽힙니다. (실측: 닫자마자 1차시 0% → 7%)
학습창닫기 = id:popup_close
; 넘기기전 은 차시 표가 '학습창 안에' 있는 사이트에서만 씁니다. 이 사이트는 비워 둡니다.
넘기기전 =

[안내창]
; '학습하기' 를 누르면 사이트가 안내창을 띄울 수 있습니다.
; 아직 어떤 글·버튼인지 확인하지 못해 비워 두었습니다.
; 비어 있으면 프로그램은 안내창을 건드리지 않습니다 (모르는 안내창은 누르지 않고 알리기만 합니다).
; 확인한 뒤 아래처럼 적으면 됩니다.
;   창 = class:modal
;   누를글 = 학습하시겠습니까|이어서 학습
;   안누를글 = 종료|나가|취소|삭제
;   누를것 = name:확인
창 =
누를글 =
안누를글 =
누를것 =
