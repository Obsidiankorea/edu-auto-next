; ==================================================
; 사이트 프로필 - 지방자치인재개발원 학습창 (logodi.nhi.go.kr)
;
; 적는 법은 산업안전포털.ini 머리말을 보세요.
; 이 사이트는 한 사이트 안에서 과정마다 플레이어가 다릅니다.
; 그래서 아래 항목들은 두 플레이어를 || 로 이어 적어 두었습니다. 되는 쪽을 알아서 씁니다.
;
;  ┌─────────────┬────────────────────────────┬──────────────────────────────────┐
;  │             │ 플레이어 ① (페이지형)       │ 플레이어 ② 존플레이어 (mpv-...)  │
;  ├─────────────┼────────────────────────────┼──────────────────────────────────┤
;  │ 예시 과정    │ 재난안전통신망의 이해        │ 노코드 AI 서비스 구현            │
;  │ 구성        │ 한 차시가 여러 페이지        │ 한 차시가 영상 한 편 (쭉 재생)    │
;  │ 시간        │ class=li-time "00:11/00:11" │ '02:36' 과 '04:44' 이 따로       │
;  │ 페이지      │ id=currentPageNum/totalPageNum │ 없음                          │
;  │ 다음        │ id=btn-next                 │ 없음 (영상 끝 = 차시 끝)          │
;  │ 재생        │ class=play-button '영상제어' │ class=mpv-toggle-btn             │
;  │ 조작 줄     │ 화면 아래                    │ 숨어 있음 (그래도 코드로는 읽힘)   │
;  └─────────────┴────────────────────────────┴──────────────────────────────────┘
;
; 두 플레이어 공통으로 조심할 것
;   - 재생 버튼이 '누를 때마다 재생↔멈춤' 이 바뀌는 전환식입니다.
;     ①은 '다음' 직후 자동 재생이 막혀 버튼 표시가 '재생 중' 인데도 실제로는 안 흐릅니다.
;     그래서 버튼 표시를 믿지 않고 '시간이 흐르는지' 로만 판단합니다. ([상태] 재생중 을 비워 둠)
;     안 흐르면 한 번 누르고, 그래도 안 흐르면 한 번 더 누릅니다. (두 번 안에 재생됩니다)
;   - 플레이어가 창보다 넓어 페이지 번호·다음 버튼이 화면 밖에 있을 수 있습니다. 코드로는 그대로 읽고 누릅니다.
;   - 차시 목록이 학습창 안에 있습니다 (id=list-group-item-1 ~ N).
;     그래서 '차시가 끝나면 다음 차시로' 를 켜면 목록 창으로 돌아가지 않고 바로 넘어갑니다.
; ==================================================

[사이트]
이름 = 지방자치인재개발원
창제목 = 학습창
설명 = 지방자치인재개발원 사이버교육 학습창 (logodi.nhi.go.kr) - 플레이어 두 종류 모두 지원
; 본체 창의 🌐 를 누르면 여기로 갑니다. 자주 가는 페이지(나라배움터 학습현황 등)로 바꿔도 됩니다.
주소 = https://logodi.nhi.go.kr

[누를것]
; ① 페이지형                 ② 존플레이어(없음)
다음 = id:btn-next || class:next-active
이전 = id:btn-prev
목차 = id:btn-index
; ① class=play-button       ② class=mpv-toggle-btn
영상제어 = class:play-button || class:mpv-toggle-btn
; ① 영상이 끝나면 나타나는 '다음' 강조
풍선 = class:next-active

[상태]
; 두 플레이어 모두 버튼 표시를 믿을 수 없다 → 비워 두면 '시간이 흐르는지' 로 판단
재생중 =

[읽을것]
; ① 한 덩어리 "00:11/00:11"   ② '02:36' 과 '04:44' 이 따로 → 시간쌍
현재시간 = class:li-time || 시간쌍 || 무늬:^\d{1,2}:\d{2}(:\d{2})?\s*/\s*\d{1,2}:\d{2}(:\d{2})?$
전체시간 =
; ① '09' 와 '/10' 을 이어서 읽는다        ② 페이지가 없다 → 못 읽음 → 영상 끝 = 차시 끝
; 숫자쌍 은 쓰지 않는다 (그림 뷰어의 '1 / 1', 차시 목록의 02·03 을 페이지로 잘못 읽음)
페이지 = id:currentPageNum ++ id:totalPageNum
안내문구 =
; 학습창의 '1차시 : 오리엔테이션' 에서 지금 차시 번호를 읽는다
차시 = 무늬:^\d+차시
; 크게 오버레이에 보여 줄 강의 이름 (같은 글 '1차시 : 오리엔테이션')
영상제목 = 무늬:^\d+차시

[문제풀이]
; class 또는 id 에 이 낱말이 들어 있으면 퀴즈 (① id=quiz_start_btn, class=ul-quiz-title)
class키워드 = quiz
이름키워드 = 정답을 고르세요 || O/X
; 퀴즈 첫 화면의 '퀴즈 시작' 버튼 (페이지마다 한 번 누름)
시작 = id:quiz_start_btn
; 보기는 목록항목 q-txt1 ~ q-txt4 (비워 두면 일반 규칙으로 찾음. 실제로 일반 규칙으로 눌림을 확인)
보기 =
푼뒤누를것 = 다음 || 풍선

[동작]
; ① 페이지가 끝나면 다음 페이지     ② 다음이 없으므로 아무 일도 일어나지 않고 차시 끝으로 간다
영상끝나면 = 다음
; 시간이 안 흐르면 누를 것 (전환식 버튼이라 한 번에 안 되면 한 번 더 누름)
멈춰있으면 = 영상제어
; '다음' 뒤 빨리 재생되도록 짧게
멈춤판단초 = 3
강의끝나면 =

[차시]
; 차시 목록이 어디에 있는지: 학습창 (학습창 안의 차시 목록) 또는 목록 창의 제목 일부
;   이 사이트는 학습창 왼쪽에 차시 목록이 있어서, 창을 닫지 않고 바로 넘어갑니다.
목록창 = 학습창
; 전체 차시와 '어디까지 들었는지' 를 읽어 올 창 (누르지 않고 읽기만 합니다)
;   나라배움터의 '학습현황' 창에는 차시마다 학습 시간이 나옵니다. (00:00:00 이면 아직 안 들은 것)
;   이 창이 안 떠 있으면 학습창의 목록에서 차시 수만 읽습니다.
진도창 = 학습현황
; 차시 줄 찾기 (숫자가 차시 번호)
;   id무늬 : id 에서 찾기   무늬 : 이름에서 찾기
;   ① ② 모두 학습창 왼쪽 차시 목록이 id=list-group-item-N 입니다
차시링크 = id무늬:^list-group-item-(\d+)$ || 무늬:^(\d+)차시$
; 차시 줄의 진도율 (다 들은 차시는 건너뛴다)
;   학습창 차시 목록: class="step p100 left" (다 들음) / "step p0 left" (안 들음). 숫자가 진도율
진도율 = class무늬:\bstep\b.*\bp(\d+)\b
; 차시 목록이 접혀 있으면 아예 안 읽힌다 → 이 버튼(왼쪽 위 '차시목록')을 눌러 펼친 뒤 찾는다
목록열기 = class:toggle
; 목록 창이 따로일 때 그 줄의 학습 시간 (00:00:00 이면 아직 안 들은 것)
학습시간 = 무늬:^\d{1,2}:\d{2}:\d{2}$
; 학습창을 닫는 방법 (목록 창이 따로일 때만 씀)
학습창닫기 = class:btn_out
